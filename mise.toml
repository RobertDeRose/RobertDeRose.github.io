[tools]
node = "22"

[tasks."site:build"]
description = "Assemble the static site, render the resume, and print its PDF into dist/"
sources = ["site/**/*", "resume.json", "resume-theme/**/*", "scripts/**/*", "package-lock.json"]
outputs = ["dist/**/*"]
run = [
  "npm ci --silent",
  "rm -rf dist && mkdir -p dist/js/vendor && cp -R site/. dist/",
  "cp node_modules/pdf-lib/dist/pdf-lib.min.js node_modules/@pdf-lib/fontkit/dist/fontkit.umd.min.js dist/js/vendor/",
  "npx resumed render resume.json -o dist/resume.html",
  "node scripts/resume-pdf.mjs",
]

[tasks."resume:pdf"]
description = "Build the site, including private/Robert-DeRose-Resume.pdf with contact details (local only)"
depends = ["site:build"]
run = "test -s private/Robert-DeRose-Resume.pdf && echo private/Robert-DeRose-Resume.pdf"

[tasks."site:serve"]
description = "Build the site and serve dist/ on http://localhost:8000"
depends = ["site:build"]
run = "python3 -m http.server ${PORT:-8000} --directory dist"
